name: dora-refresh
# Key DevOps Integration (#5): cron refresh of PR data.
# Local-only variant: regenerates mock data daily; swap the run step for
# `gh api repos/{owner}/{repo}/pulls` when you have network + token.
on:
  schedule:
    - cron: "0 2 * * *"  # daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install pandas numpy
          cd capstone_dora
          python generate_mock_data.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh DORA mock data"
          file_pattern: capstone_dora/data/prs.csv
