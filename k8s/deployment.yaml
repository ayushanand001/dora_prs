apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora-tracker
  labels:
    app: dora-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dora-tracker
  template:
    metadata:
      labels:
        app: dora-tracker
    spec:
      containers:
      - name: dashboard
        image: dora-tracker:latest  # local-only: use minikube/kind load or docker build tag
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
